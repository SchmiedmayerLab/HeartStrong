version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      security-dependencies:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 7
      exclude: ["SchmiedmayerLab/*"]
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      security-dependencies:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      exclude: ["SchmiedmayerLab/*"]
    ignore:
      # TypeScript-ESLint 8 currently requires TypeScript < 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
