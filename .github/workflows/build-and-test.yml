name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      site_url:
        type: string
        default: ""
      site_base:
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  SITE_URL: ${{ inputs.site_url }}
  SITE_BASE: ${{ inputs.site_base }}

jobs:
  security-capabilities:
    name: Detect GitHub Code Security availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.code-security.outputs.enabled }}
    steps:
      - name: Check repository security capabilities
        id: code-security
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          visibility="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${REPOSITORY}" --jq '.visibility')"
          code_security="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${REPOSITORY}" --jq '.security_and_analysis.code_security.status // .security_and_analysis.advanced_security.status // "unavailable"')"

          if [[ "${visibility}" == 'public' || "${code_security}" == 'enabled' ]]; then
            echo 'enabled=true' >> "${GITHUB_OUTPUT}"
            echo '::notice title=GitHub Code Security available::Licensed pull requests will receive dependency review.'
          else
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
            echo "::notice title=GitHub Code Security unavailable::Dependency review is intentionally skipped for this ${visibility} repository."
          fi

  reuse:
    name: REUSE Compliance Check
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.5

  markdown-links:
    name: Markdown Link Check
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.5

  actionlint:
    name: Workflow syntax
    uses: SchmiedmayerLab/.github/.github/workflows/actionlint.yml@v0.5

  quality:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Check formatting
        run: npm run format:check
      - name: Verify runtime and browser version pins
        run: npm run test:toolchain
      - name: Run code, style, and Markdown linters
        run: npm run lint
      - name: Audit local Markdown links and fragments
        run: npm run test:md-links
      - name: Validate Astro content and TypeScript
        run: npm run check
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Install locked dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Audit generated routes, links, fragments, assets, and metadata
        run: npm run test:site
      - name: Package and audit only public dependencies
        run: npm run bundle:public && npm run bundle:audit
      - name: Save the audited site for browser tests
        uses: actions/upload-artifact@v7
        with:
          name: public-bundle
          path: |
            _site/
            release-manifest.json
          retention-days: 7
          if-no-files-found: error

  portability:
    name: Build and audit GitHub project path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build, audit, and exercise the GitHub project path
        run: npm run test:portability

  browser:
    name: Browser and accessibility (${{ matrix.project }})
    needs: [quality, build, portability]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project:
          - compact-phone-chromium
          - phone-webkit
          - tablet-chromium
          - desktop-chromium
          - wide-desktop-chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - name: Install locked dependencies
        run: npm ci
      - name: Download the audited site
        uses: actions/download-artifact@v8
        with:
          name: public-bundle
      - name: Recheck the downloaded artifact
        run: npm run bundle:audit
      - name: Test phone, tablet, desktop, and wide-screen behavior with Axe
        timeout-minutes: 20
        run: npm run test:e2e -- --project="${PROJECT}"
        env:
          PROJECT: ${{ matrix.project }}
          SITE_OUTPUT_DIR: _site
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  test-results:
    name: Test and Coverage
    needs: [quality, build, portability, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PORTABILITY_RESULT: ${{ needs.portability.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          [[ "${QUALITY_RESULT}" == 'success' &&
             "${BUILD_RESULT}" == 'success' &&
             "${PORTABILITY_RESULT}" == 'success' &&
             "${BROWSER_RESULT}" == 'success' ]]

  dependency-review:
    name: Dependency review
    needs: security-capabilities
    if: ${{ github.event_name == 'pull_request' && needs.security-capabilities.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
